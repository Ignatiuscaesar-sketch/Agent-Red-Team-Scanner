[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-redteam-scanner"
version = "0.1.0"
description = "Fuzz your own LLM agents for prompt injection and tool abuse, then patch what it finds."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ignatiuscaesar-sketch" }]
keywords = ["llm", "security", "red-team", "prompt-injection", "agents", "fuzzing"]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
dev = ["pytest>=7.0"]

[project.scripts]
redteam-scan = "redteam_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
